---
name: multicast-boundary-autorp
prefix: ""

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:latest
  nodes:
    rp:
      kind: cisco_iol
      startup-config: ./startup-configs/rp.cfg.partial
    boundary:
      kind: cisco_iol
      startup-config: ./startup-configs/boundary.cfg.partial
    receiver-outside:
      kind: cisco_iol
      startup-config: ./startup-configs/receiver-outside.cfg.partial
    receiver-inside:
      kind: cisco_iol
      startup-config: ./startup-configs/receiver-inside.cfg.partial
  links:
    - endpoints: ['rp:Ethernet0/1', 'boundary:Ethernet0/1']
    - endpoints: ['boundary:Ethernet0/2', 'receiver-outside:Ethernet0/1']
    - endpoints: ['boundary:Ethernet0/3', 'receiver-inside:Ethernet0/1']

...