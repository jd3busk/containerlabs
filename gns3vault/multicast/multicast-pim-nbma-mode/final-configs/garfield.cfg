!
hostname garfield
!
!
!
ip multicast-routing 
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.12.1 255.255.255.0
 ip pim sparse-mode
!
!         
!
router eigrp 100
 network 192.168.12.0
!
!
!
ip pim autorp listener
!
!
!
line vty 0 4
 exec-timeout 0 0
 logging synchronous
 exec prompt timestamp
!
end