!
hostname r4
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.24.4 255.255.255.0
 ip igmp join-group 239.1.1.1
 ip igmp join-group 239.2.2.2
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
line vty 0 4
 logging synchronous
 exec prompt timestamp
 exec-timeout 0 0
 privilege level 15
!
end