!
hostname video-server
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.13.3 255.255.255.0
!
!
!
router ospf 1
 router-id 3.3.3.3
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end