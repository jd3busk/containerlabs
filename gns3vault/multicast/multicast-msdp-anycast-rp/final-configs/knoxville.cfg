!
hostname knoxville
!
!
!
ip multicast-routing
!
!
!
interface Loopback0
 no shutdown
 ip address 2.2.2.2 255.255.255.255
 ip pim sparse-mode
!
interface Loopback1
 no shutdown
 ip address 12.12.12.12 255.255.255.255
 ip pim sparse-mode
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.12.2 255.255.255.0
 ip pim sparse-mode
!
interface Ethernet0/2
 no shutdown
 ip address 192.168.24.2 255.255.255.0
 ip pim sparse-mode
!
!
!
router ospf 1
 router-id 2.2.2.2
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
ip pim rp-address 12.12.12.12
!
ip msdp peer 1.1.1.1 connect-source Loopback0
!
ip msdp originator-id Loopback0
!
ip access-list extended MSDP_SA_FILTER
 10 permit ip any 239.0.0.0 0.255.255.255
 100 deny ip any any
!
ip msdp sa-filter in 1.1.1.1 list MSDP_SA_FILTER
ip msdp sa-filter out 1.1.1.1 list MSDP_SA_FILTER
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end