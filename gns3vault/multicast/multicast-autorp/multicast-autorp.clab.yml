---
name: multicast-autorp
prefix: ""

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:latest
  nodes:
    rendezvous-point:
      kind: cisco_iol
      startup-config: ./startup-configs/rendezvous-point.cfg.partial
    transit-2:
      kind: cisco_iol
      startup-config: ./startup-configs/transit-2.cfg.partial
    mapping-agent:
      kind: cisco_iol
      startup-config: ./startup-configs/mapping-agent.cfg.partial
    receiver:
      kind: cisco_iol
      startup-config: ./startup-configs/receiver.cfg.partial
    transit-1:
      kind: cisco_iol
      startup-config: ./startup-configs/transit-1.cfg.partial
  links:
  - endpoints: ['rendezvous-point:Ethernet0/1', 'mapping-agent:Ethernet0/1']
  - endpoints: ['rendezvous-point:Ethernet0/2', 'transit-1:Ethernet0/1']
  - endpoints: ['transit-2:Ethernet0/1', 'transit-1:Ethernet0/2']
  - endpoints: ['transit-2:Ethernet0/2', 'receiver:Ethernet0/1']

...