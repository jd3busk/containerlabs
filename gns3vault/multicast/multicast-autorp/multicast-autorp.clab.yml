---
name: multicast-autorp
prefix: ""

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:latest
  nodes:
    ma:
      kind: cisco_iol
      startup-config: ./startup-configs/ma.cfg.partial
    transit:
      kind: cisco_iol
      startup-config: ./startup-configs/transit.cfg.partial
    source:
      kind: cisco_iol
      startup-config: ./startup-configs/source.cfg.partial
    receiver:
      kind: cisco_iol
      startup-config: ./startup-configs/receiver.cfg.partial
    rp:
      kind: cisco_iol
      startup-config: ./startup-configs/rp.cfg.partial
  links:
  - endpoints: ['ma:Ethernet0/1', 'source:Ethernet0/1']
  - endpoints: ['ma:Ethernet0/2', 'rp:Ethernet0/1']
  - endpoints: ['transit:Ethernet0/1', 'rp:Ethernet0/2']
  - endpoints: ['transit:Ethernet0/2', 'receiver:Ethernet0/1']

...