!
hostname echo
!
!
!
ip multicast-routing 
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.45.5 255.255.255.0
 ip pim dense-mode
 ip igmp join-group 224.1.1.1
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
line vty 0 4
 logging synchronous
 exec prompt timestamp
 exec-timeout 0 0
 privilege level 15
!
end