!
hostname backhand
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.23.3 255.255.255.0
!
interface Ethernet0/2
 no shutdown
 ip address 192.168.35.3 255.255.255.0
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
line vty 0 4
 logging synchronous
 exec prompt timestamp
 exec-timeout 0 0
 privilege level 15
!
end