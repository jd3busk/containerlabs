    - bridge0|bridge0:eth9
  - endpoints:
    - R10:Ethernet0/1
    - bridge0|bridge0:eth10
  - endpoints:
    - SW1:Ethernet0/1
    - SW3:Ethernet0/1
  - endpoints:
    - SW1:Ethernet0/2
    - SW3:Ethernet0/2
  - endpoints:
    - SW2:Ethernet0/1
    - SW4:Ethernet0/1
  - endpoints:
