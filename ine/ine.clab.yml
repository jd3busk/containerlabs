    - SW4:Ethernet1/0
  - endpoints:
    - SW3:Ethernet0/3
    - SW2:Ethernet0/3
  - endpoints:
    - SW3:Ethernet1/0
    - SW2:Ethernet1/0
  - endpoints:
    - SW1:Ethernet1/1
    - SW2:Ethernet1/1
  - endpoints:
    - SW1:Ethernet1/2
    - SW2:Ethernet1/2
  - endpoints:
    - SW3:Ethernet1/1
    - SW4:Ethernet1/1
  - endpoints:
    - SW3:Ethernet1/2
    - SW4:Ethernet1/2
  - endpoints:
