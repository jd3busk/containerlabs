---
name: rstp

topology:
  nodes:
    DSW1:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01a
    DSW2:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01a
    ASW1:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01a
    ASW2:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01a
    Host-1:
      kind: linux
      image: alpine:latest
  links:
    [
      { endpoints: [ "DSW1:Ethernet0/1", "DSW2:Ethernet0/1" ] },
      { endpoints: [ "DSW1:Ethernet0/2", "ASW1:Ethernet0/1" ] },
      { endpoints: [ "DSW1:Ethernet0/3", "ASW2:Ethernet0/1" ] },
      { endpoints: [ "DSW2:Ethernet0/2", "ASW1:Ethernet0/2" ] },
      { endpoints: [ "DSW2:Ethernet0/3", "ASW2:Ethernet0/2" ] },
      { endpoints: [ "DSW2:Ethernet1/0", "ASW2:Ethernet0/3" ] },
      { endpoints: [ "Host-1:eth1", "ASW1:Ethernet0/3" ] }
    ]
