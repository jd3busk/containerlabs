---
name: ivr

topology:
  nodes:
    R1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.16.01a

    SW1:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01a

    PC-1:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1

    PC-2:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth0 up
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route replace default via 192.168.20.1 dev eth1

  links:
    - endpoints: [ "SW1:Ethernet0/1", "R1:Ethernet0/1" ]
    - endpoints: [ "PC-1:eth1", "SW1:Ethernet0/2" ]
    - endpoints: [ "PC-2:eth1", "SW1:Ethernet0/3" ]
