!
hostname video-client
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.24.4 255.255.255.0
 ip igmp version 2
 ip igmp join-group 224.1.1.1
 ip igmp join-group 239.1.1.1
!
!
!
router ospf 1
 router-id 4.4.4.4
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end