!
hostname boundary
!
!
!
ip multicast-routing 
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.12.2 255.255.255.0
 ip pim sparse-mode
!
interface Ethernet0/2
 no shutdown
 ip address 192.168.23.2 255.255.255.0
 ip pim sparse-mode
 ip multicast boundary receiver-outside_RP_GROUPS filter-autorp
!
interface Ethernet0/3
 no shutdown
 ip address 192.168.24.2 255.255.255.0
 ip pim sparse-mode
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
ip pim autorp listener
!
ip access-list standard receiver-outside_RP_GROUPS
 permit 224.0.1.39
 permit 224.0.1.40
 permit 239.1.1.1
 permit 239.2.2.2
 deny 239.3.3.3
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end
