!
hostname border
!
!
!
ip multicast-routing 
!
!
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.12.2 255.255.255.0
 ip pim sparse-mode
!
interface Ethernet0/2
 no shutdown
 ip address 192.168.23.2 255.255.255.0
 ip pim sparse-mode
 ip multicast boundary PARTNER_SOURCE_GROUPS out
!
interface Ethernet0/3
 no shutdown
 ip address 192.168.24.2 255.255.255.0
 ip pim sparse-mode
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
ip pim autorp listener
!
ip access-list extended PARTNER_SOURCE_GROUPS
 permit ip host 1.1.1.1 host 224.0.1.40
 permit ip host 0.0.0.0 host 239.1.1.1
 permit ip host 0.0.0.0 host 239.2.2.2
 permit ip host 1.1.1.1 host 239.1.1.1
 permit ip host 1.1.1.1 host 239.2.2.2
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end