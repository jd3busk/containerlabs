!
hostname production
!
!
!
ip multicast-routing
!
!
!
interface Loopback0
 no shutdown
 ip address 1.1.1.1 255.255.255.255
 ip pim sparse-mode
!
interface Ethernet0/1
 no shutdown
 ip address 192.168.12.1 255.255.255.0
 ip pim sparse-mode
!
!
!
router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
!
!
!
ip pim autorp listener
!
ip pim send-rp-discovery Loopback0 scope 10
!
ip pim send-rp-announce Loopback0 scope 10 group-list VIDEO_GROUPS
!
ip access-list standard VIDEO_GROUPS
 permit 239.1.1.1
 permit 239.2.2.2
 permit 239.3.3.3
!
!
!
line vty 0 4
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 login local
 exec prompt timestamp
 transport input ssh
!
end