!
hostname arlene
!
!         
!
ip multicast-routing 
!
!
!
interface Tunnel0
 no shutdown
 ip address 192.168.234.3 255.255.255.0
 ip mtu 1400
 ip pim sparse-mode
 ip nhrp map 192.168.234.4 10.0.0.4
 ip nhrp map multicast 10.0.0.4
 ip nhrp network-id 100
 ip nhrp nhs 192.168.234.4
 ip igmp join-group 224.1.1.1
 tunnel source Ethernet0/1
 tunnel destination 10.0.0.4
 tunnel key 100
!
interface Ethernet0/1
 no shutdown
 ip address 10.0.0.3 255.255.255.0
!
!
!
router eigrp 100
 network 192.168.234.0
!
!
!
ip pim autorp listener
!
!
!
line vty 0 4
 exec-timeout 0 0
 logging synchronous
 exec prompt timestamp
!
end