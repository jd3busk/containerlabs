---
name: multicast-bidir-pim
prefix: ""

topology:
  kinds:
    cisco_iol:
      image: vrnetlab/cisco_iol:latest
  nodes:
    rp:
      kind: cisco_iol
      startup-config: ./startup-configs/rp.cfg.partial
    transit-1:
      kind: cisco_iol
      startup-config: ./startup-configs/transit-1.cfg.partial
    transit-2:
      kind: cisco_iol
      startup-config: ./startup-configs/transit-2.cfg.partial
    endpoint-1:
      kind: cisco_iol
      startup-config: ./startup-configs/endpoint-1.cfg.partial
    endpoint-2:
      kind: cisco_iol
      startup-config: ./startup-configs/endpoint-2.cfg.partial
  links:
    - endpoints: ['rp:Ethernet0/1', 'transit-1:Ethernet0/2']
    - endpoints: ['rp:Ethernet0/2', 'transit-2:Ethernet0/1']
    - endpoints: ['transit-1:Ethernet0/1', 'endpoint-1:Ethernet0/1']
    - endpoints: ['transit-2:Ethernet0/2', 'endpoint-2:Ethernet0/1']

...
